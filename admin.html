<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Rotisería del Amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">🍕</div>
      <h1>Rotisería del Amor</h1>
      <p class="login-subtitle">Panel de administración</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="error-msg" aria-live="polite"></p>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel" hidden>

    <header class="admin-header">
      <span class="admin-brand">🍕 Admin — Rotisería del Amor</span>
      <div class="header-actions">
        <a href="index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver sitio ↗</a>
        <button id="logout-btn" class="btn-secondary">Cerrar sesión</button>
      </div>
    </header>

    <main class="admin-main">

      <!-- FORMULARIO AGREGAR / EDITAR -->
      <section class="admin-section" id="form-section">
        <h2 id="form-title">Agregar plato</h2>
        <form id="plato-form" class="plato-form" novalidate>

          <div class="form-row">
            <div class="field">
              <label for="plato-nombre">Nombre *</label>
              <input type="text" id="plato-nombre" placeholder="Ej: Napolitana" required />
            </div>
            <div class="field">
              <label for="plato-categoria">Categoría *</label>
              <select id="plato-categoria" required>
                <option value="clasicas">Pizzas Clásicas</option>
                <option value="especiales">Pizzas Especiales</option>
                <option value="compartir">Bandejas para Compartir</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="plato-descripcion">Descripción / Ingredientes</label>
            <input type="text" id="plato-descripcion" placeholder="Ej: Muzza, tomate, albahaca, orégano" />
          </div>

          <div class="form-row">
            <div class="field">
              <label for="plato-precio">Precio (ARS) *</label>
              <input type="number" id="plato-precio" placeholder="14000" min="0" required />
            </div>
            <div class="field">
              <label for="plato-badge">Badge <span class="hint">(Especial, XL, etc.)</span></label>
              <input type="text" id="plato-badge" placeholder="Opcional" />
            </div>
            <div class="field">
              <label for="plato-icono">Ícono emoji <span class="hint">(solo bandejas)</span></label>
              <input type="text" id="plato-icono" placeholder="🍟" maxlength="4" />
            </div>
          </div>

          <div class="field">
            <label for="plato-imagen">Foto del plato</label>
            <input type="file" id="plato-imagen" accept="image/*" />
            <img id="img-preview" class="img-preview" hidden alt="Vista previa de la foto" />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="save-btn">Guardar plato</button>
            <button type="button" id="cancel-btn" class="btn-secondary" hidden>Cancelar edición</button>
          </div>

        </form>
      </section>

      <!-- LISTA DE PLATOS -->
      <section class="admin-section">
        <h2>Menú actual</h2>
        <div id="lista-platos"></div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
